# Local PostgreSQL for tests and development. Not the self-hosting stack:
# that is docker-compose.yml.
#
# Nothing here holds real data. The database is thrown away between runs and
# the passwords are fixed and public on purpose, so nobody is tempted to
# believe this is a place to keep something.
#
# The project follows TEST_DB_PORT, so a database on a port of its own is a
# project of its own: setting the port alone never recreates the shared one on
# 5439. The shared one is the bare `schellingaf-test` only while TEST_DB_PORT is
# unset: exporting TEST_DB_PORT=5439 names `schellingaf-test-5439`, which finds
# the port taken. COMPOSE_PROJECT_NAME, when set, still names the project.
name: schellingaf-test${TEST_DB_PORT:+-${TEST_DB_PORT}}

services:
  postgres:
    image: postgres:18-trixie
    # node --test runs as many files at once as the machine has cores, less one,
    # and each file opens pools of its own; the default hundred connections ran
    # out at about twelve files. Three hundred covers about twenty-five.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: schellingaf
      POSTGRES_PASSWORD: test_superuser_password_not_a_secret
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8"
      # Read by 01_roles.sh. Fixed, local, throwaway.
      OWNER_PASSWORD: test_owner_password_not_a_secret
      MIGRATE_PASSWORD: test_migrate_password_not_a_secret
      API_PASSWORD: test_api_password_not_a_secret
    ports:
      # 127.0.0.1 on purpose. A ports entry with no interface binds every
      # interface, and this database has a fixed superuser password. Nothing in
      # test/ or scripts/ connects from anywhere but loopback.
      - "127.0.0.1:${TEST_DB_PORT:-5439}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, never the socket: a socket check reports ready during initdb,
      # before the init scripts have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d schellingaf"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    tmpfs:
      # Throwaway by construction: the data directory never touches the disk.
      - /var/lib/postgresql
